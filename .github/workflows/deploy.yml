name: Deploy

# dev -> dev, test -> staging, main -> prod, matching the backend repo.
on:
  push:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC federated credential exchange
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'test' && 'staging' || 'dev' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # NEXT_PUBLIC_ variables are inlined into the bundle at build time.
      # Mock auth stays on until the live auth APIs are connected. Flip
      # NEXT_PUBLIC_USE_MOCK_AUTH to false and set the API base URL then.
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_USE_MOCK_AUTH: ${{ vars.NEXT_PUBLIC_USE_MOCK_AUTH || 'true' }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.NEXT_PUBLIC_API_BASE_URL || vars.VITE_API_BASE_URL }}
        run: |
          if [ "$NEXT_PUBLIC_USE_MOCK_AUTH" = "false" ] && [ -z "$NEXT_PUBLIC_API_BASE_URL" ]; then
            echo "::error::NEXT_PUBLIC_API_BASE_URL is not set for this environment. The build would ship a frontend that cannot reach the API."
            exit 1
          fi
          npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Fetched per run rather than stored as a GitHub secret, so there is no
      # long-lived deployment token to rotate or leak. add-mask keeps it out of the log
      # even if a later step echoes it.
      - name: Fetch Static Web App deployment token
        id: swa
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ vars.AZURE_SWA_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "properties.apiKey" -o tsv)
          if [ -z "$token" ]; then
            echo "::error::Could not read the deployment token for ${{ vars.AZURE_SWA_NAME }}."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      # skip_app_build: the bundle was already built above with the right environment
      # variables. Letting the action rebuild would discard them.
      - name: Upload to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/out
          skip_app_build: true
          skip_api_build: true
