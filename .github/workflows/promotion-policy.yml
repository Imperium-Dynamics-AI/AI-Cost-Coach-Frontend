name: Branch Promotion Policy

on:
  pull_request:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

jobs:
  validate-promotion-source:
    name: Validate promotion source
    runs-on: ubuntu-latest
    steps:
      - name: Check allowed source branch
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          case "$BASE_BRANCH" in
            main)
              expected="test"
              ;;
            test)
              expected="dev"
              ;;
            dev)
              exit 0
              ;;
            *)
              echo "::error::Unsupported target branch: $BASE_BRANCH"
              exit 1
              ;;
          esac

          if [[ "$HEAD_BRANCH" != "$expected" ]]; then
            echo "::error::$BASE_BRANCH accepts pull requests only from $expected; received $HEAD_BRANCH."
            exit 1
          fi

          echo "Allowed promotion: $HEAD_BRANCH -> $BASE_BRANCH"
