[project]
name = "azure-ai-cost-coach-backend"
version = "0.1.0"
description = "Backend API service for Azure AI Cost Coach"
authors = [
    {name = "Aarib Vahidy"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27.0",
    "apscheduler>=3.10.0",
]
requires-python = ">=3.10"
readme = "README.md"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
